name: Build iOS Package

on:
  push:
    branches: [ master, main, 'feature/**' ]
  pull_request:
    branches: [ master, main, 'feature/**' ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA & App
    runs-on: macos-latest
    defaults:
      run:
        working-directory: maintenance_assistant

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test test/widget_test.dart
        continue-on-error: true

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build iOS App (Release, No CodeSign)
        run: |
          flutter build ios --release --no-codesign

      - name: Package into IPA format
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r -q maintenance_assistant_unsigned.ipa Payload
          cd ../../..

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-assistant-ios-ipa
          path: maintenance_assistant/build/ios/iphoneos/maintenance_assistant_unsigned.ipa
          retention-days: 14

      - name: Upload Runner.app Artifact
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-assistant-ios-runner-app
          path: maintenance_assistant/build/ios/iphoneos/Runner.app
          retention-days: 14
